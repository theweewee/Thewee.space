<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>SYSTEM_ROOT // THEWEE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  
  <!-- Fonte Hacker -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00ff41; /* Verde Matrix */
      --danger: #ff0000;
      --glass: rgba(10, 20, 30, 0.90);
      --text: #e0e0e0;
    }

    /* BLOQUEIOS GERAIS */
    * { 
      margin: 0; padding: 0; box-sizing: border-box; 
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; /* Remove flash azul no android */
    }

    body {
      background: #000;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      height: 100vh; width: 100vw;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      cursor: none; /* Esconde mouse no PC */
    }

    /* FUNDO */
    #bg-gif {
      position: fixed; inset: 0;
      background: url("https://media.tenor.com/J_7_S-32W44AAAAC/cloud-fire.gif") center center / cover no-repeat;
      opacity: 0.3; z-index: -2;
    }
    #matrix-canvas { position: fixed; inset: 0; z-index: -1; }
    .scanlines {
      position: fixed; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none; z-index: 9000;
    }

    /* CURSOR MAKITA */
    #custom-cursor {
      position: fixed; width: 60px; height: 60px;
      background: url("https://raw.githubusercontent.com/theweewee/Thewee.space/main/assets/makita.png") no-repeat center/contain;
      pointer-events: none; z-index: 10000;
      transform: translate(-50%, -50%);
      display: none;
      filter: drop-shadow(0 0 5px var(--primary));
    }
    .cursor-spin { animation: spin 0.1s linear infinite; }
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    /* JANELA DO SISTEMA */
    #system-container {
      width: 90%; max-width: 500px;
      border: 1px solid var(--primary);
      background: var(--glass);
      backdrop-filter: blur(10px);
      padding: 20px;
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
      display: none;
      flex-direction: column; gap: 15px;
      position: relative;
      z-index: 50;
      max-height: 80vh;
    }

    .sys-header {
      border-bottom: 1px solid var(--primary);
      padding-bottom: 10px;
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--primary);
      flex-shrink: 0;
    }

    /* BOTÕES E SCROLL */
    .file-list-wrapper {
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 5px;
    }
    /* Scrollbar estilo hacker */
    .file-list-wrapper::-webkit-scrollbar { width: 5px; }
    .file-list-wrapper::-webkit-scrollbar-track { background: #000; }
    .file-list-wrapper::-webkit-scrollbar-thumb { background: var(--primary); }

    .file-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }

    .file-btn {
      background: rgba(0,0,0,0.6);
      border: 1px solid #444;
      color: var(--text);
      padding: 15px;
      text-decoration: none;
      display: flex; align-items: center; gap: 15px;
      font-size: 0.9rem; text-transform: uppercase;
      pointer-events: auto; cursor: pointer;
      transition: 0.2s;
    }

    .file-btn:active, .file-btn:hover {
      border-color: var(--primary);
      background: rgba(0, 255, 65, 0.2);
      text-shadow: 0 0 8px var(--primary);
    }

    /* TELA DE BOOT */
    #boot-screen {
      position: fixed; inset: 0;
      background: #000; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: var(--primary); padding: 20px; text-align: center;
    }
    .click-prompt { 
      margin-top: 30px; border: 1px solid var(--primary); 
      padding: 15px 30px; animation: blink 1s infinite; 
      font-size: 1.2rem; cursor: pointer; pointer-events: auto;
      display: none; background: rgba(0, 255, 65, 0.1);
    }

    /* BARRA DE AQUECIMENTO */
    #heat-wrapper { width: 100%; height: 6px; background: #333; margin-top: 10px; border-radius: 3px; flex-shrink: 0; }
    #heat-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s; }

    /* EFEITOS VISUAIS */
    @keyframes glitch { 
      0% { transform: translate(0); } 20% { transform: translate(-3px, 3px); } 
      40% { transform: translate(-3px, -3px); } 60% { transform: translate(3px, 3px); } 
      80% { transform: translate(3px, -3px); } 100% { transform: translate(0); } 
    }
    .chaos-mode { animation: glitch 0.1s infinite; filter: contrast(1.5) hue-rotate(90deg); }
    @keyframes blink { 50% { opacity: 0; } }
    
    #danger-overlay { position: fixed; inset: 0; background: red; opacity: 0; pointer-events: none; z-index: 8000; transition: opacity 0.1s; }

  </style>
</head>
<body>

  <div id="bg-gif"></div>
  <canvas id="matrix-canvas"></canvas>
  <div class="scanlines"></div>
  <div id="danger-overlay"></div>
  <div id="custom-cursor"></div>

  <!-- TELA INICIAL -->
  <div id="boot-screen">
    <div id="boot-text" style="white-space: pre-wrap; text-align: left; font-size: 0.9rem;"></div>
    <div class="click-prompt" id="start-btn">INICIAR SISTEMA</div>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="system-container">
    <div class="sys-header">
      <span>USER: THEWEE</span>
      <span id="sys-status">ONLINE</span>
    </div>

    <div class="file-list-wrapper">
      <div class="file-list" id="file-list"></div>
    </div>

    <div style="margin-top: 10px; font-size: 0.7rem; opacity: 0.7;">MAKITA_RPM:</div>
    <div id="heat-wrapper"><div id="heat-bar"></div></div>
  </div>

  <!-- ÁUDIOS -->
  <audio id="audio-bg" loop>
    <source src="https://www.myinstants.com/media/sounds/dexter-song-2.mp3" type="audio/mpeg" />
  </audio>
  <audio id="audio-makita" loop>
    <source src="https://www.myinstants.com/media/sounds/makitaa.mp3" type="audio/mpeg" />
  </audio>
  <audio id="audio-crash">
     <source src="https://www.myinstants.com/media/sounds/windows-xp-error.mp3" type="audio/mpeg" />
  </audio>
  <audio id="sound-gyro">
    <source src="https://www.myinstants.com/media/sounds/foi-quando-gyro-finalmente-entendeu.mp3" type="audio/mpeg" />
  </audio>
  <audio id="sound-click">
    <source src="https://www.myinstants.com/media/sounds/mamboman-bo-shi-ge-ju-matikanetannhauser.mp3" type="audio/mpeg" />
  </audio>

  <script>
    /* =================================================
       1. CONFIGURAÇÃO DE PASTAS
       ================================================= */
    const REPO_OWNER = "theweewee";
    const REPO_NAME = "Thewee.space";
    const TARGET_FOLDER = "pasta-liquida"; // A pasta onde seus HTMLs estão

    // Botões Fixos (Sempre aparecem)
    const FIXED_BUTTONS = [
      { name: "💻 GITHUB ROOT", url: `https://github.com/${REPO_OWNER}`, soundId: "sound-gyro" }
    ];

    const IGNORE_LIST = ["index.html", "_notes"]; // Arquivos para ignorar dentro da pasta liquida

    /* =================================================
       2. VARIÁVEIS DO SISTEMA
       ================================================= */
    const els = {
      cursor: document.getElementById('custom-cursor'),
      bootScreen: document.getElementById('boot-screen'),
      bootText: document.getElementById('boot-text'),
      startBtn: document.getElementById('start-btn'),
      sysContainer: document.getElementById('system-container'),
      fileList: document.getElementById('file-list'),
      heatBar: document.getElementById('heat-bar'),
      danger: document.getElementById('danger-overlay'),
      status: document.getElementById('sys-status')
    };

    const audio = {
      bg: document.getElementById('audio-bg'),
      makita: document.getElementById('audio-makita'),
      crash: document.getElementById('audio-crash')
    };

    let state = {
      booted: false,
      holding: false,
      heat: 0,
      crashed: false,
      fetchedButtons: []
    };

    /* =================================================
       3. MATRIX RAIN (OTIMIZADO)
       ================================================= */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resizeMatrix() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeMatrix); resizeMatrix();
    const letters = "01 THEWEE LIQUID";
    const drops = Array(Math.floor(width / 14)).fill(1);
    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
      drops.forEach((y, i) => {
        ctx.fillText(letters[Math.floor(Math.random()*letters.length)], i*14, y*14);
        if(y*14 > height && Math.random() > 0.975) drops[i] = 0; drops[i]++;
      });
      requestAnimationFrame(drawMatrix);
    }
    drawMatrix();

    /* =================================================
       4. SCANNER DO GITHUB (DETECTA PASTA-LIQUIDA)
       ================================================= */
    async function scanRepository() {
      try {
        els.bootText.innerHTML += `Scanning /${TARGET_FOLDER}...<br>`;
        
        // Chama API do GitHub para ler a pasta específica
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_FOLDER}`);
        
        if (!response.ok) {
           // Se der 404 (pasta não existe ainda), não quebra o site, só avisa
           if(response.status === 404) throw new Error("Folder not found");
           throw new Error("Network Error");
        }

        const files = await response.json();

        files.forEach(file => {
          if (IGNORE_LIST.includes(file.name)) return;

          let displayName = file.name.replace(".html", "").replace(/-/g, " ").toUpperCase();
          
          // Se for pasta, assume que tem um index.html dentro
          // Caminho: pasta-liquida/NOME/index.html
          let linkUrl = file.type === "dir" 
            ? `./${TARGET_FOLDER}/${file.name}/index.html`
            : `./${TARGET_FOLDER}/${file.name}`;

          state.fetchedButtons.push({
            name: "📂 " + displayName,
            url: linkUrl,
            soundId: "sound-click"
          });
        });

        els.bootText.innerHTML += `Objects Detected: ${state.fetchedButtons.length} [OK]<br>`;

      } catch (error) {
        els.bootText.innerHTML += `Scan Alert: ${error.message} (Using fixed links only)<br>`;
        console.log("Github API Info:", error);
      }
    }

    /* =================================================
       5. BOOT
       ================================================= */
    const bootLines = ["Initializing Kernel...", "Mounting Liquid Folder...", "Verifying Makita RPM..."];
    let line = 0;

    async function runBoot() {
      if (line < bootLines.length) {
        els.bootText.innerHTML += bootLines[line] + "<br>";
        line++;
        setTimeout(runBoot, 300);
      } else {
        await scanRepository();
        els.startBtn.style.display = "block";
      }
    }
    window.onload = runBoot;

    function startSystem() {
      if(state.booted) return;
      state.booted = true;
      els.bootScreen.style.display = 'none';
      els.sysContainer.style.display = 'flex';
      audio.bg.volume = 0.3;
      audio.bg.play().catch(()=>{});
      renderButtons();
    }
    els.startBtn.addEventListener('click', startSystem);
    els.startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startSystem(); });

    /* =================================================
       6. RENDERIZAR BOTÕES
       ================================================= */
    function renderButtons() {
      els.fileList.innerHTML = ""; 
      const allButtons = [...FIXED_BUTTONS, ...state.fetchedButtons];

      allButtons.forEach(btnData => {
        const a = document.createElement('a');
        a.href = btnData.url;
        a.className = 'file-btn';
        if(btnData.url.startsWith('http')) a.target = "_blank";
        
        a.innerHTML = `<span>${btnData.name}</span>`;

        const btnSound = document.getElementById(btnData.soundId);
        
        // Evento de Click (PC + Mobile seguro)
        const handleClick = (e) => {
           // Toca som
           if(btnSound) { btnSound.currentTime = 0; btnSound.play().catch(()=>{}); }
           // Navegador segue o link naturalmente
        };

        a.addEventListener('click', handleClick);

        // Previne que a makita ative em cima do botão no touch
        a.addEventListener('touchstart', (e) => e.stopPropagation(), {passive: true});
        a.addEventListener('mousedown', (e) => e.stopPropagation());

        els.fileList.appendChild(a);
      });
    }

    /* =================================================
       7. CURSOR E MAKITA (CAOS)
       ================================================= */
    function updateCursor(x, y) {
      els.cursor.style.display = 'block';
      els.cursor.style.left = x + 'px'; els.cursor.style.top = y + 'px';
    }

    function triggerChaos(x, y) {
      if(!state.booted || state.crashed) return;
      state.holding = true;
      updateCursor(x, y);
      audio.bg.pause(); audio.makita.currentTime = 0; audio.makita.play().catch(()=>{});
      els.cursor.classList.add('cursor-spin');
      document.body.classList.add('chaos-mode');
    }

    function stopChaos() {
      if(!state.holding) return;
      state.holding = false;
      audio.makita.pause();
      els.cursor.classList.remove('cursor-spin');
      document.body.classList.remove('chaos-mode');
      els.danger.style.opacity = 0;
      if(!state.crashed) { state.heat = 0; updateHeat(); audio.bg.play().catch(()=>{}); els.cursor.style.display = 'none'; }
    }

    // PC INPUTS
    document.addEventListener('mousemove', e => { if(state.booted && !state.crashed) updateCursor(e.clientX, e.clientY); });
    window.addEventListener('mousedown', e => {
      if(state.booted && (e.button === 0 || e.button === 1)) triggerChaos(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', stopChaos);

    // MOBILE INPUTS (TOUCH)
    window.addEventListener('touchstart', e => {
      // Se o alvo não for um botão, liga a makita
      if(!e.target.closest('.file-btn') && !e.target.closest('.click-prompt') && state.booted) {
         triggerChaos(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, {passive: false});

    window.addEventListener('touchmove', e => { 
      if(state.holding) updateCursor(e.touches[0].clientX, e.touches[0].clientY); 
    }, {passive: false});
    
    window.addEventListener('touchend', stopChaos);

    /* =================================================
       8. AQUECIMENTO
       ================================================= */
    setInterval(() => {
      if(state.crashed) return;
      if(state.holding) {
        state.heat += 2;
        const s = 5;
        els.sysContainer.style.transform = `translate(${Math.random()*s-s/2}px, ${Math.random()*s-s/2}px)`;
        els.danger.style.opacity = state.heat / 100;
        if(state.heat > 70) els.status.innerText = "WARNING: OVERHEAT";
        if(state.heat >= 100) crashSystem();
      } else {
        if(state.heat > 0) state.heat -= 5;
        els.sysContainer.style.transform = "none";
      }
      updateHeat();
    }, 50);

    function updateHeat() {
      if(state.heat < 0) state.heat = 0;
      els.heatBar.style.width = state.heat + "%";
      els.heatBar.style.background = state.heat < 50 ? "var(--primary)" : "red";
      if(state.heat < 50) { els.status.innerText = "ONLINE"; els.status.style.color = "var(--primary)"; }
      else { els.status.style.color = "red"; }
    }

    function crashSystem() {
      state.crashed = true; state.holding = false;
      audio.makita.pause(); audio.crash.play().catch(()=>{});
      document.body.style.background = "#0000aa";
      els.sysContainer.style.display = 'none'; els.cursor.style.display = 'none';
      document.body.classList.remove('chaos-mode');
      els.bootScreen.style.display = 'flex'; els.startBtn.style.display = 'none';
      els.bootText.innerHTML = "FATAL ERROR 0xC0000221<br>SYSTEM OVERLOAD.<br><br>Rebooting...";
      setTimeout(() => location.reload(), 4000);
    }
  </script>
</body>
</html>
