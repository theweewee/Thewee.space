<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>SYSTEM_ROOT // THEWEE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  
  <!-- Fonte Hacker -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;800&display=swap" rel="stylesheet">

  <style>
    /* ================= ESTILOS (VISUAL HACKER) ================= */
    :root {
      --primary: #00ff41; /* Verde Matrix */
      --danger: #ff0000;
      --glass: rgba(5, 10, 15, 0.92);
      --text: #e0e0e0;
    }

    * { 
      margin: 0; padding: 0; box-sizing: border-box; 
      -webkit-user-select: none; user-select: none; /* Sem seleção de texto */
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      height: 100vh; width: 100vw;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      cursor: none; /* Cursor escondido (substituído pela Makita) */
    }

    /* --- FUNDOS E EFEITOS --- */
    #bg-gif {
      position: fixed; inset: 0;
      background: url("https://media.tenor.com/J_7_S-32W44AAAAC/cloud-fire.gif") center center / cover no-repeat;
      opacity: 0.25; z-index: -2;
    }
    #matrix-canvas { position: fixed; inset: 0; z-index: -1; }
    .scanlines {
      position: fixed; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none; z-index: 9000;
    }

    /* --- CURSOR MAKITA --- */
    #custom-cursor {
      position: fixed; width: 60px; height: 60px;
      background: url("https://raw.githubusercontent.com/theweewee/Thewee.space/main/assets/makita.png") no-repeat center/contain;
      pointer-events: none; z-index: 10000;
      transform: translate(-50%, -50%);
      display: none;
      filter: drop-shadow(0 0 8px var(--primary));
    }
    .cursor-spin { animation: spin 0.1s linear infinite; }
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    /* --- JANELA DO SISTEMA --- */
    #system-container {
      width: 90%; max-width: 450px;
      border: 1px solid var(--primary);
      background: var(--glass);
      backdrop-filter: blur(12px);
      padding: 20px;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.15);
      display: none; /* Escondido até iniciar */
      flex-direction: column; gap: 15px;
      position: relative;
      z-index: 50;
      max-height: 80vh;
    }

    .sys-header {
      border-bottom: 1px solid var(--primary);
      padding-bottom: 10px;
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--primary);
      flex-shrink: 0;
    }

    /* LISTA DE ARQUIVOS (BOTÕES) */
    .file-list-wrapper {
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 5px;
    }
    /* Scrollbar personalizada */
    .file-list-wrapper::-webkit-scrollbar { width: 4px; }
    .file-list-wrapper::-webkit-scrollbar-track { background: #000; }
    .file-list-wrapper::-webkit-scrollbar-thumb { background: var(--primary); }

    .file-list { display: flex; flex-direction: column; gap: 10px; width: 100%; }

    .file-btn {
      background: rgba(0,0,0,0.6);
      border: 1px solid #333;
      color: var(--text);
      padding: 12px 15px;
      text-decoration: none;
      display: flex; align-items: center; gap: 15px;
      font-size: 0.85rem; text-transform: uppercase;
      pointer-events: auto; cursor: pointer;
      transition: all 0.2s;
    }

    .file-btn:hover, .file-btn:active {
      border-color: var(--primary);
      background: rgba(0, 255, 65, 0.15);
      padding-left: 20px; /* Animação de deslize */
      text-shadow: 0 0 5px var(--primary);
    }

    /* --- TELA DE BOOT --- */
    #boot-screen {
      position: fixed; inset: 0;
      background: #000; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: var(--primary); padding: 20px; text-align: center;
    }
    .click-prompt { 
      margin-top: 25px; border: 1px solid var(--primary); 
      padding: 15px 30px; animation: blink 1s infinite; 
      font-size: 1rem; cursor: pointer; pointer-events: auto;
      display: none; background: rgba(0, 255, 65, 0.1);
    }
    .boot-log { font-size: 0.8rem; color: #0f0; text-align: left; white-space: pre-wrap; }

    /* --- BARRA DE AQUECIMENTO (OVERHEAT) --- */
    #heat-wrapper { width: 100%; height: 4px; background: #333; margin-top: 10px; border-radius: 2px; flex-shrink: 0; }
    #heat-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s; }

    /* EFEITOS DE CAOS */
    @keyframes glitch { 
      0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 
      40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 
      80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } 
    }
    .chaos-mode { animation: glitch 0.08s infinite; filter: contrast(1.3) hue-rotate(90deg); }
    @keyframes blink { 50% { opacity: 0.3; } }
    
    #danger-overlay { position: fixed; inset: 0; background: #f00; opacity: 0; pointer-events: none; z-index: 8000; transition: opacity 0.1s; }

  </style>
</head>
<body>

  <!-- ELEMENTOS DE FUNDO -->
  <div id="bg-gif"></div>
  <canvas id="matrix-canvas"></canvas>
  <div class="scanlines"></div>
  <div id="danger-overlay"></div>
  <div id="custom-cursor"></div>

  <!-- TELA DE BOOT (INICIALIZAÇÃO) -->
  <div id="boot-screen">
    <div id="boot-text" class="boot-log"></div>
    <div class="click-prompt" id="start-btn">CONNECT SYSTEM</div>
  </div>

  <!-- JANELA PRINCIPAL -->
  <div id="system-container">
    <div class="sys-header">
      <span>LOC: PASTA-LIQUIDA</span>
      <span id="sys-status">ONLINE</span>
    </div>

    <div class="file-list-wrapper">
      <!-- AQUI O JAVASCRIPT VAI INJETAR OS BOTÕES -->
      <div class="file-list" id="file-list"></div>
    </div>

    <div style="margin-top: 10px; font-size: 0.7rem; opacity: 0.6;">MAKITA_RPM_LOAD:</div>
    <div id="heat-wrapper"><div id="heat-bar"></div></div>
  </div>

  <!-- SONS (LINKS EXTERNOS PARA SEGURANÇA) -->
  <audio id="audio-bg" loop>
    <source src="https://www.myinstants.com/media/sounds/dexter-song-2.mp3" type="audio/mpeg" />
  </audio>
  <audio id="audio-makita" loop>
    <source src="https://www.myinstants.com/media/sounds/makitaa.mp3" type="audio/mpeg" />
  </audio>
  <audio id="audio-crash">
     <source src="https://www.myinstants.com/media/sounds/windows-xp-error.mp3" type="audio/mpeg" />
  </audio>
  <audio id="sound-click">
    <source src="https://www.myinstants.com/media/sounds/mamboman-bo-shi-ge-ju-matikanetannhauser.mp3" type="audio/mpeg" />
  </audio>

  <script>
    /* =================================================
       1. CONFIGURAÇÃO DO SCANNER (IMPORTANTE)
       ================================================= */
    const REPO_OWNER = "theweewee";   // Seu usuário
    const REPO_NAME = "Thewee.space"; // Seu repositório
    const TARGET_FOLDER = "pasta-liquida"; // A pasta que o script vai ler

    // Arquivos que devem ser ignorados pelo scanner
    const IGNORE_LIST = ["index.html", "404.html", "_redirects"];

    // Botões que SEMPRE aparecem (fixos)
    const FIXED_BUTTONS = [
      { name: "💾 ROOT (HOME)", url: "https://github.com/theweewee/Thewee.space", soundId: "sound-click" }
    ];

    /* =================================================
       2. VARIÁVEIS DE CONTROLE
       ================================================= */
    const els = {
      cursor: document.getElementById('custom-cursor'),
      bootScreen: document.getElementById('boot-screen'),
      bootText: document.getElementById('boot-text'),
      startBtn: document.getElementById('start-btn'),
      sysContainer: document.getElementById('system-container'),
      fileList: document.getElementById('file-list'),
      heatBar: document.getElementById('heat-bar'),
      danger: document.getElementById('danger-overlay'),
      status: document.getElementById('sys-status')
    };

    const audio = {
      bg: document.getElementById('audio-bg'),
      makita: document.getElementById('audio-makita'),
      crash: document.getElementById('audio-crash')
    };

    let state = {
      booted: false,
      holding: false,
      heat: 0,
      crashed: false,
      fetchedButtons: []
    };

    /* =================================================
       3. SCANNER DA API DO GITHUB (O CÉREBRO)
       ================================================= */
    async function scanRepository() {
      try {
        els.bootText.innerHTML += `> Connecting to ${TARGET_FOLDER}...\n`;
        
        // URL da API para ler a pasta específica
        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${TARGET_FOLDER}`;
        const response = await fetch(apiUrl);

        if (!response.ok) throw new Error(`API Error: ${response.status}`);
        
        const data = await response.json();

        // Processa cada item encontrado na pasta
        data.forEach(item => {
          if (IGNORE_LIST.includes(item.name)) return;

          let displayName = item.name.replace(".html", "").replace(/-/g, " ").toUpperCase();
          let finalUrl = "";

          if (item.type === "dir") {
            // Se for pasta, o link aponta para pasta-liquida/nome/
            finalUrl = `./${TARGET_FOLDER}/${item.name}/`;
            displayName = "📁 " + displayName;
          } else if (item.type === "file" && item.name.endsWith(".html")) {
            // Se for arquivo HTML, aponta para pasta-liquida/nome.html
            finalUrl = `./${TARGET_FOLDER}/${item.name}`;
            displayName = "📄 " + displayName;
          }

          if (finalUrl) {
            state.fetchedButtons.push({
              name: displayName,
              url: finalUrl,
              soundId: "sound-click"
            });
          }
        });

        els.bootText.innerHTML += `> Detected ${state.fetchedButtons.length} entries.\n`;
        els.bootText.innerHTML += `> System Ready.\n`;

      } catch (error) {
        els.bootText.innerHTML += `> Scan Failed: ${error.message}\n> Loading backups...\n`;
        console.warn("Github API failed:", error);
      }
    }

    /* =================================================
       4. MATRIX RAIN (FUNDO VISUAL)
       ================================================= */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    const chars = "01 THEWEE SPACE LIQUID";
    const drops = Array(Math.floor(width / 14)).fill(1);
    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#00ff41"; ctx.font = "14px monospace";
      drops.forEach((y, i) => {
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, y*14);
        if(y*14 > height && Math.random() > 0.98) drops[i] = 0; drops[i]++;
      });
      requestAnimationFrame(drawMatrix);
    }
    drawMatrix();

    /* =================================================
       5. INICIALIZAÇÃO (BOOT)
       ================================================= */
    const bootLines = [
      "> Initializing Kernel...",
      "> Verifying Makita RPM... [OK]",
      "> Mounting 'pasta-liquida'..."
    ];
    let lineIdx = 0;

    async function bootSequence() {
      if (lineIdx < bootLines.length) {
        els.bootText.innerHTML += bootLines[lineIdx] + "\n";
        lineIdx++;
        setTimeout(bootSequence, 300);
      } else {
        // Roda o scanner ao final do texto
        await scanRepository();
        els.startBtn.style.display = "block";
      }
    }
    window.onload = bootSequence;

    // Iniciar Sistema
    function startSystem() {
      if(state.booted) return;
      state.booted = true;
      els.bootScreen.style.display = 'none';
      els.sysContainer.style.display = 'flex';
      
      audio.bg.volume = 0.3;
      audio.bg.play().catch(()=>{});
      
      renderButtons();
    }
    els.startBtn.addEventListener('click', startSystem);
    els.startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startSystem(); }, {passive: false});

    /* =================================================
       6. RENDERIZAR BOTÕES
       ================================================= */
    function renderButtons() {
      els.fileList.innerHTML = ""; 
      // Une botões fixos com os detectados
      const allButtons = [...FIXED_BUTTONS, ...state.fetchedButtons];

      allButtons.forEach(btnData => {
        const a = document.createElement('a');
        a.href = btnData.url;
        a.className = 'file-btn';
        if(btnData.url.startsWith('http')) a.target = "_blank"; // Abre externo em nova aba
        
        a.innerHTML = `<span>${btnData.name}</span>`;

        const btnSound = document.getElementById(btnData.soundId);
        
        // Click seguro (toca som e vai)
        const clickHandler = () => {
           if(btnSound) { btnSound.currentTime = 0; btnSound.play().catch(()=>{}); }
        };
        a.addEventListener('click', clickHandler);

        // IMPEDE que a makita ative ao clicar no botão (Mobile/PC)
        a.addEventListener('mousedown', e => e.stopPropagation());
        a.addEventListener('touchstart', e => e.stopPropagation(), {passive: true});

        els.fileList.appendChild(a);
      });
    }

    /* =================================================
       7. MAKITA (CAOS E AQUECIMENTO)
       ================================================= */
    function updateCursor(x, y) {
      els.cursor.style.display = 'block';
      els.cursor.style.left = x + 'px'; els.cursor.style.top = y + 'px';
    }

    function startChaos(x, y) {
      if(!state.booted || state.crashed) return;
      state.holding = true;
      updateCursor(x, y);
      
      audio.bg.pause(); 
      audio.makita.currentTime = 0; 
      audio.makita.play().catch(()=>{});
      
      els.cursor.classList.add('cursor-spin');
      document.body.classList.add('chaos-mode');
    }

    function stopChaos() {
      if(!state.holding) return;
      state.holding = false;
      
      audio.makita.pause();
      els.cursor.classList.remove('cursor-spin');
      document.body.classList.remove('chaos-mode');
      els.danger.style.opacity = 0;
      
      if(!state.crashed) { 
        state.heat = 0; 
        updateHeat(); 
        audio.bg.play().catch(()=>{}); 
        els.cursor.style.display = 'none'; 
      }
    }

    // INPUTS PC
    window.addEventListener('mousemove', e => { if(state.booted && !state.crashed) updateCursor(e.clientX, e.clientY); });
    window.addEventListener('mousedown', e => {
      // Só ativa se não for botão
      if(state.booted && (e.button === 0 || e.button === 1) && !e.target.closest('.file-btn')) {
        startChaos(e.clientX, e.clientY);
      }
    });
    window.addEventListener('mouseup', stopChaos);

    // INPUTS MOBILE (Touch)
    window.addEventListener('touchstart', e => {
      if(state.booted && !e.target.closest('.file-btn') && !e.target.closest('.click-prompt')) {
         startChaos(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, {passive: false});
    window.addEventListener('touchmove', e => { if(state.holding) updateCursor(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
    window.addEventListener('touchend', stopChaos);
    window.addEventListener('touchcancel', stopChaos);

    /* =================================================
       8. LOOP DE JOGO (AQUECIMENTO)
       ================================================= */
    setInterval(() => {
      if(state.crashed) return;
      if(state.holding) {
        state.heat += 2;
        const shake = 5;
        els.sysContainer.style.transform = `translate(${Math.random()*shake - shake/2}px, ${Math.random()*shake - shake/2}px)`;
        els.danger.style.opacity = state.heat / 100;
        if(state.heat > 70) els.status.innerText = "WARNING: HIGH RPM";
        if(state.heat >= 100) crashSystem();
      } else {
        if(state.heat > 0) state.heat -= 5;
        els.sysContainer.style.transform = "none";
      }
      updateHeat();
    }, 50);

    function updateHeat() {
      if(state.heat < 0) state.heat = 0;
      els.heatBar.style.width = state.heat + "%";
      els.heatBar.style.background = state.heat < 50 ? "var(--primary)" : "red";
      els.status.style.color = state.heat < 50 ? "var(--primary)" : "red";
      if(state.heat < 50) els.status.innerText = "ONLINE";
    }

    function crashSystem() {
      state.crashed = true; state.holding = false;
      audio.makita.pause(); audio.crash.play().catch(()=>{});
      
      document.body.style.background = "#0000aa"; // Tela azul
      els.sysContainer.style.display = 'none'; 
      els.cursor.style.display = 'none';
      document.body.classList.remove('chaos-mode');
      
      els.bootScreen.style.display = 'flex'; 
      els.startBtn.style.display = 'none';
      els.bootText.innerHTML = "FATAL ERROR 0xC0000221\n> MAKITA RPM OVERLOAD.\n> REBOOTING SYSTEM...";
      
      setTimeout(() => location.reload(), 4000);
    }
  </script>
</body>
</html>
