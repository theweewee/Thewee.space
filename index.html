<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>THEWEE.SPACE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #38bdf8;
      --glass: rgba(0, 0, 0, 0.6);
      --text: #f9fafb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      background: url("./assets/Thiscloudfire.gif") center center / cover no-repeat fixed;
      display: flex;
      justify-content: center;
    }

    /* CURSOR MAKITA */
    #custom-cursor {
      position: fixed;
      width: 60px; height: 60px;
      pointer-events: none;
      z-index: 99999;
      background-image: url("./assets/makita.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transform: translate(-50%, -50%);
      transition: transform 0.05s linear;
    }
    .spinning { animation: spin 0.1s linear infinite; }
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    /* START SCREEN */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
    }
    #start-overlay h1 { animation: pulse 1s infinite; cursor: none; }

    /* MENU CONTAINER */
    main {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 90%;
      max-width: 400px;
    }

    h1.logo {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--primary);
      margin-bottom: 10px;
    }

    /* ESTILO DOS BOTÕES DO MENU */
    .menu-list {
      display: flex;
      flex-direction: column; /* Um embaixo do outro */
      gap: 10px;
      width: 100%;
    }

    .link-btn {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 0;
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      text-decoration: none;
      background: var(--glass);
      backdrop-filter: blur(8px);
      transition: 0.2s;
      font-size: 1rem;
      text-transform: uppercase;
      pointer-events: auto; 
      overflow: hidden;
    }

    /* Efeito de hover nos botões */
    .link-btn:hover {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
      letter-spacing: 2px; /* Expande o texto */
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    /* Pequena barra lateral no hover */
    .link-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--primary);
      transition: 0.2s;
    }
    .link-btn:hover::before { width: 5px; }

    /* TREMOR (MAKITA) */
    @keyframes shake {
      0% { transform: translate(1px, 1px); }
      25% { transform: translate(-2px, -2px); }
      50% { transform: translate(2px, 1px); }
      75% { transform: translate(-1px, 2px); }
      100% { transform: translate(1px, -1px); }
    }
    .shaking { animation: shake 0.05s infinite; filter: contrast(1.2); }

    /* MUTE BTN */
    #mute-btn {
      position: absolute;
      top: 20px; right: 20px;
      background: transparent; border: 1px solid white;
      color: white; padding: 5px 10px;
      z-index: 100; pointer-events: auto;
      font-family: inherit;
    }

    @keyframes pulse { 50% { opacity: 0.5; } }
  </style>
</head>
<body>

  <div id="custom-cursor"></div>

  <div id="start-overlay">
    <h1>[ CLIQUE PARA INICIAR ]</h1>
  </div>

  <button id="mute-btn">SOM: ON</button>

  <div class="frame">
    <main>
      <h1 class="logo">THEWEE</h1>
      
      <!-- MENU DE LINKS -->
      <div class="menu-list">
        <!-- Link 1: Subpasta de Projetos (exemplo) -->
        <a class="link-btn" href="./projetos/index.html">
          PROJETOS
        </a>

        <!-- Link 2: Subpasta Sobre (exemplo) -->
        <a class="link-btn" href="./sobre.html">
          SOBRE MIM
        </a>

        <!-- Link 3: GitHub Externo -->
        <a class="link-btn" href="https://github.com/theweewee" target="_blank">
          GITHUB
        </a>
      </div>

    </main>
  </div>

  <!-- ÁUDIOS -->
  <audio id="bg-audio" loop>
    <source src="https://www.myinstants.com/media/sounds/dexter-song-2.mp3" type="audio/mpeg" />
  </audio>
  <audio id="click-audio">
    <source src="https://www.myinstants.com/media/sounds/mamboman-bo-shi-ge-ju-matikanetannhauser.mp3" type="audio/mpeg" />
  </audio>
  <audio id="hover-audio">
    <source src="https://www.myinstants.com/media/sounds/foi-quando-gyro-finalmente-entendeu.mp3" type="audio/mpeg" />
  </audio>
  <audio id="hold-audio" loop>
    <source src="https://www.myinstants.com/media/sounds/makitaa.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const cursor = document.getElementById('custom-cursor');
    const body = document.body;
    const overlay = document.getElementById('start-overlay');
    const muteBtn = document.getElementById('mute-btn');
    
    // Seleciona TODOS os botões com a classe .link-btn
    const allButtons = document.querySelectorAll('.link-btn');

    const audios = {
      bg: document.getElementById('bg-audio'),
      click: document.getElementById('click-audio'),
      hover: document.getElementById('hover-audio'),
      hold: document.getElementById('hold-audio')
    };

    let started = false;
    let isMuted = false;
    let isHolding = false;

    // Mouse Follow
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // Start
    overlay.addEventListener('click', () => {
      started = true;
      overlay.style.display = 'none';
      audios.bg.volume = 0.3;
      playSafe(audios.bg);
      playSafe(audios.click);
    });

    // Mute
    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.innerText = isMuted ? "SOM: OFF" : "SOM: ON";
      Object.values(audios).forEach(a => a.muted = isMuted);
    });

    // --- LÓGICA MAKITA ---
    function startMakita() {
      if (!started) return;
      isHolding = true;
      audios.bg.pause();
      audios.hover.pause(); audios.hover.currentTime = 0;
      
      playSafe(audios.hold);
      body.classList.add('shaking');
      cursor.classList.add('spinning');
    }

    function stopMakita() {
      if (!isHolding) return;
      isHolding = false;
      audios.hold.pause(); audios.hold.currentTime = 0;
      body.classList.remove('shaking');
      cursor.classList.remove('spinning');
      if(started) playSafe(audios.bg);
    }

    // --- APLICAR EVENTOS EM TODOS OS BOTÕES ---
    allButtons.forEach(btn => {
      
      // Mouse Enter (Hover Sound)
      btn.addEventListener('mouseenter', () => {
        if (started && !isHolding) {
          audios.bg.pause();
          audios.hover.currentTime = 0;
          playSafe(audios.hover);
        }
      });

      // Mouse Leave (Retorna som de fundo)
      btn.addEventListener('mouseleave', () => {
        if (started && !isHolding) {
           // Se quiser cortar o som do hover imediatamente, descomente:
           // audios.hover.pause(); 
           if(audios.hover.paused) playSafe(audios.bg);
        }
      });

      // Mouse Down (Makita no botão esquerdo)
      btn.addEventListener('mousedown', (e) => {
        if(e.button === 0) { // Botão esquerdo
          // e.preventDefault(); // Se quiser impedir o clique imediato para apreciar a makita, descomente.
          startMakita();
        }
      });

    });
    
    // Som do hover acabou? Volta música.
    audios.hover.addEventListener('ended', () => {
       if(started && !isHolding) playSafe(audios.bg);
    });

    // Mouse Down Global (Botão do meio/scroll)
    window.addEventListener('mousedown', (e) => {
      if (e.button === 1) { // Botão do meio
        e.preventDefault();
        startMakita();
      }
    });

    // Mouse Up Global (Para a Makita)
    window.addEventListener('mouseup', stopMakita);

    function playSafe(audio) {
      if (!isMuted) audio.play().catch(() => {});
    }
  </script>
</body>
</html>
