<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>thewee.space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* sem rolagem */
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f9fafb;
      background: #000 url("./assets/thewee-bg.gif") center center / cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      /* cursor makita */
      cursor: url("./assets/makita.png"), auto;
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100%;
    }

    main {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      text-align: center;
      padding: 0 16px;
    }

    h1 {
      font-size: 30px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    a.link-github {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      padding: 6px 18px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      text-decoration: none;
      font-size: 13px;
      gap: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    a.link-github::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #38bdf8;
    }

    a.link-github:hover {
      border-color: #38bdf8;
      cursor: url("./assets/makita.png"), pointer;
    }
  </style>
</head>
<body>
  <div class="frame">
    <main id="click-area">
      <h1>THEWEE</h1>

      <a
        id="github-link"
        class="link-github"
        href="https://github.com/theweewee"
        target="_blank"
        rel="noopener noreferrer"
      >
        github
      </a>
    </main>
  </div>

  <!-- áudio de fundo em loop -->
  <audio id="bg-audio" loop>
    <source src="https://www.myinstants.com/media/sounds/dexter-song-2.mp3" type="audio/mpeg" />
  </audio>

  <!-- efeito sonoro no clique geral -->
  <audio id="click-audio">
    <source src="https://www.myinstants.com/media/sounds/mamboman-bo-shi-ge-ju-matikanetannhauser.mp3" type="audio/mpeg" />
  </audio>

  <!-- áudio especial no hover do GitHub -->
  <audio id="hover-audio">
    <source src="https://www.myinstants.com/media/sounds/foi-quando-gyro-finalmente-entendeu.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const bg = document.getElementById("bg-audio");
    const clickSound = document.getElementById("click-audio");
    const hoverSound = document.getElementById("hover-audio");
    const githubLink = document.getElementById("github-link");

    let bgStarted = false;
    let hoverPlaying = false;

    function startBgIfNeeded() {
      if (!bgStarted) {
        bg.play().catch(() => {});
        bgStarted = true;
      }
    }

    // clique em qualquer lugar: garante fundo e toca efeito curto
    document.addEventListener("click", () => {
      startBgIfNeeded();
      if (!hoverPlaying) {
        clickSound.currentTime = 0;
        clickSound.play().catch(() => {});
      }
    });

    // hover no link do GitHub: pausa fundo e toca o áudio especial
    githubLink.addEventListener("mouseenter", () => {
      startBgIfNeeded();
      if (hoverPlaying) return;

      hoverPlaying = true;
      bg.pause();
      clickSound.pause();
      clickSound.currentTime = 0;

      hoverSound.currentTime = 0;
      hoverSound.play().catch(() => {});
    });

    // quando o áudio de hover termina, volta o fundo
    hoverSound.addEventListener("ended", () => {
      hoverPlaying = false;
      bg.play().catch(() => {});
    });
  </script>
</body>
</html>
