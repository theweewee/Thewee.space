      <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>thewee.space</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* impede rolagem */
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f9fafb;
      background: #000 url("./assets/thewee-bg.gif") center center / cover no-repeat fixed;
      display: flex;
      align-items: center;     /* centra verticalmente o container */
      justify-content: center; /* centra horizontalmente o container */
    }

    .frame {
      position: relative;
      width: 100%;
      height: 100%;
    }

    main {
      position: absolute;
      left: 50%;
      bottom: 40px;          /* distância da borda inferior */
      transform: translateX(-50%);
      text-align: center;
      padding: 0 16px;
    }

    h1 {
      font-size: 30px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    a.link-github {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      padding: 6px 18px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      color: #e5e7eb;
      text-decoration: none;
      font-size: 13px;
      gap: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    a.link-github::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #38bdf8;
    }

    a.link-github:hover {
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="frame">
    <main>
      <h1>THEWEE</h1>

      <a
        class="link-github"
        href="https://github.com/theweewee"
        target="_blank"
        rel="noopener noreferrer"
      >
        github
      </a>
    </main>
  </div>
</body>
</html>
