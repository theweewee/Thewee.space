<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>SYSTEM_ROOT // TEHEW</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Fonte Hacker -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00ff41; /* Verde Matrix */
      --danger: #ff0000;
      --glass: rgba(10, 20, 30, 0.8);
      --text: #e0e0e0;
    }

    /* --- BLOQUEIO DE SELEÇÃO E CURSOR --- */
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      
      /* Esconde o cursor padrão */
      cursor: none !important; 
      
      /* IMPEDE SELEÇÃO DE TEXTO (O SEGREDO) */
      -webkit-user-select: none; /* Safari/Chrome */
      -moz-user-select: none;    /* Firefox */
      -ms-user-select: none;     /* IE/Edge */
      user-select: none;         /* Padrão */
      
      /* Impede arrastar imagens */
      -webkit-user-drag: none;
    }

    body {
      background: #000;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* FUNDO */
    #bg-gif {
      position: fixed; inset: 0;
      background: url("https://media.tenor.com/J_7_S-32W44AAAAC/cloud-fire.gif") center center / cover no-repeat;
      opacity: 0.3; z-index: -2;
    }
    #matrix-canvas { position: fixed; inset: 0; z-index: -1; }
    .scanlines {
      position: fixed; inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none; z-index: 9000;
    }

    /* CURSOR */
    #custom-cursor {
      position: fixed; width: 50px; height: 50px;
      background: url("https://raw.githubusercontent.com/theweewee/Thewee.space/main/assets/makita.png") no-repeat center/contain;
      pointer-events: none; z-index: 10000;
      transition: transform 0.05s;
      display: none; /* Só aparece se mover o mouse */
      filter: drop-shadow(0 0 5px var(--primary));
    }
    .cursor-spin { animation: spin 0.1s linear infinite; }
    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    /* SISTEMA (JANELA) */
    #system-container {
      width: 90%; max-width: 500px;
      border: 1px solid var(--primary);
      background: var(--glass);
      backdrop-filter: blur(10px);
      padding: 25px;
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
      display: none; /* Hidden until start */
      flex-direction: column; gap: 20px;
      position: relative;
    }

    .sys-header {
      border-bottom: 1px solid var(--primary);
      padding-bottom: 10px;
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: var(--primary);
    }

    /* BOTÕES (SISTEMA DE ARQUIVOS) */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    .file-btn {
      background: rgba(0,0,0,0.6);
      border: 1px solid #444;
      color: var(--text);
      padding: 15px;
      text-decoration: none;
      display: flex; align-items: center; gap: 15px;
      transition: 0.2s;
      font-size: 1rem; text-transform: uppercase;
      /* IMPORTANTE: Permite clique, mas herda o bloqueio de seleção do * */
      pointer-events: auto; 
    }

    .file-btn:hover {
      border-color: var(--primary);
      background: rgba(0, 255, 65, 0.1);
      padding-left: 25px; /* Efeito de movimento */
      text-shadow: 0 0 8px var(--primary);
    }

    /* TELA DE BOOT */
    #boot-screen {
      position: fixed; inset: 0;
      background: #000; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: var(--primary);
    }
    .click-prompt { 
      margin-top: 20px; border: 1px solid var(--primary); 
      padding: 10px 20px; animation: blink 1s infinite; 
      /* Permite clicar mas não selecionar */
      pointer-events: auto; 
      display: none; 
    }

    /* BARRA DE AQUECIMENTO */
    #heat-wrapper { width: 100%; height: 4px; background: #333; margin-top: 10px; }
    #heat-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.1s; }

    /* Animações de Erro */
    @keyframes glitch { 
      0% { transform: translate(0); } 
      20% { transform: translate(-3px, 3px); } 
      40% { transform: translate(-3px, -3px); } 
      60% { transform: translate(3px, 3px); } 
      80% { transform: translate(3px, -3px); } 
      100% { transform: translate(0); } 
    }
    .chaos-mode { animation: glitch 0.1s infinite; filter: contrast(1.5) hue-rotate(90deg); }
    @keyframes blink { 50% { opacity: 0; } }
    
    /* Overlay Vermelho */
    #danger-overlay { position: fixed; inset: 0; background: red; opacity: 0; pointer-events: none; z-index: 8000; transition: opacity 0.1s; }

  </style>
</head>
<body>

  <div id="bg-gif"></div>
  <canvas id="matrix-canvas"></canvas>
  <div class="scanlines"></div>
  <div id="danger-overlay"></div>
  <div id="custom-cursor"></div>

  <!-- TELA INICIAL -->
  <div id="boot-screen">
    <div id="boot-text" style="white-space: pre-wrap; text-align: left;"></div>
    <div class="click-prompt" id="start-btn">[ INICIAR SISTEMA ]</div>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="system-container">
    <div class="sys-header">
      <span>USER: TEHEW</span>
      <span id="sys-status">ONLINE</span>
    </div>

    <!-- AQUI FICAM OS BOTÕES -->
    <div class="file-list" id="file-list"></div>

    <!-- BARRA DE AQUECIMENTO -->
    <div style="margin-top: 10px; font-size: 0.7rem; opacity: 0.7;">MAKITA_RPM:</div>
    <div id="heat-wrapper"><div id="heat-bar"></div></div>
  </div>

  <!-- ÁUDIOS GERAIS -->
  <audio id="audio-bg" loop>
    <source src="https://www.myinstants.com/media/sounds/dexter-song-2.mp3" type="audio/mpeg" />
  </audio>
  <audio id="audio-makita" loop>
    <source src="https://www.myinstants.com/media/sounds/makitaa.mp3" type="audio/mpeg" />
  </audio>
  <audio id="audio-crash">
     <source src="https://www.myinstants.com/media/sounds/windows-xp-error.mp3" type="audio/mpeg" />
  </audio>

  <!-- ÁUDIOS ESPECÍFICOS PARA BOTÕES -->
  <audio id="sound-gyro">
    <source src="https://www.myinstants.com/media/sounds/foi-quando-gyro-finalmente-entendeu.mp3" type="audio/mpeg" />
  </audio>
  
  <audio id="sound-click">
    <source src="https://www.myinstants.com/media/sounds/mamboman-bo-shi-ge-ju-matikanetannhauser.mp3" type="audio/mpeg" />
  </audio>

  <script>
    /* =================================================
       1. CONFIGURAÇÃO DOS BOTÕES (Nome, Link, ID do Som)
       ================================================= */
    const BUTTONS = [
      {
        name: "GITHUB",
        url: "https://github.com/tehewdev", 
        soundId: "sound-gyro", 
        icon: "💻"
      },
      {
        name: "HOME PAGE (ANTIGA)",
        url: "https://github.com/theweewee/Thewee.space/blob/main/index.html", 
        soundId: "sound-click", 
        icon: "🏠"
      },
      {
        name: "OUTRO LINK",
        url: "#", 
        soundId: "sound-click", 
        icon: "⚙️"
      }
    ];

    /* =================================================
       2. SISTEMA E VARIÁVEIS
       ================================================= */
    const els = {
      cursor: document.getElementById('custom-cursor'),
      bootScreen: document.getElementById('boot-screen'),
      bootText: document.getElementById('boot-text'),
      startBtn: document.getElementById('start-btn'),
      sysContainer: document.getElementById('system-container'),
      fileList: document.getElementById('file-list'),
      heatBar: document.getElementById('heat-bar'),
      danger: document.getElementById('danger-overlay'),
      status: document.getElementById('sys-status')
    };

    const audio = {
      bg: document.getElementById('audio-bg'),
      makita: document.getElementById('audio-makita'),
      crash: document.getElementById('audio-crash')
    };

    let state = {
      booted: false,
      holding: false,
      heat: 0,
      crashed: false,
      currentHoverSound: null
    };

    /* =================================================
       3. MATRIX RAIN (Fundo)
       ================================================= */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const letters = "01 TEHEW SYS";
    const drops = Array(Math.floor(canvas.width / 14)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00ff41";
      ctx.font = "14px monospace";
      drops.forEach((y, i) => {
        ctx.fillText(letters[Math.floor(Math.random()*letters.length)], i*14, y*14);
        if(y*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
      requestAnimationFrame(drawMatrix);
    }
    drawMatrix();

    /* =================================================
       4. BOOT SEQUENCE
       ================================================= */
    const bootLines = [
      "Booting Kernel...",
      "Loading User Data...",
      "Verifying Makita RPM... [READY]",
      "System Loaded."
    ];
    let line = 0;
    function runBoot() {
      if(line < bootLines.length) {
        els.bootText.innerHTML += bootLines[line] + "<br>";
        line++;
        setTimeout(runBoot, 400);
      } else {
        els.startBtn.style.display = "block";
      }
    }
    window.onload = runBoot;

    // Ao clicar em INICIAR
    els.startBtn.addEventListener('click', () => {
      state.booted = true;
      els.bootScreen.style.display = 'none';
      els.sysContainer.style.display = 'flex';
      
      audio.bg.volume = 0.3;
      audio.bg.play().catch(()=>{});

      renderButtons();
    });

    /* =================================================
       5. RENDERIZAR BOTÕES
       ================================================= */
    function renderButtons() {
      els.fileList.innerHTML = ""; 

      BUTTONS.forEach(btnData => {
        const a = document.createElement('a');
        a.href = btnData.url;
        a.className = 'file-btn';
        a.target = btnData.url.startsWith('http') ? '_blank' : '_self';
        a.innerHTML = `<span>${btnData.icon}</span> <span>${btnData.name}</span>`;

        const btnSound = document.getElementById(btnData.soundId);

        // Hover
        a.addEventListener('mouseenter', () => {
          if(!state.holding && !state.crashed) {
            if(state.currentHoverSound) {
              state.currentHoverSound.pause();
              state.currentHoverSound.currentTime = 0;
            }
            state.currentHoverSound = btnSound;
            audio.bg.pause();
            btnSound.currentTime = 0;
            btnSound.play().catch(()=>{});
          }
        });

        // Leave
        a.addEventListener('mouseleave', () => {
          if(!state.holding && !state.crashed) {
             if(audio.bg.paused) audio.bg.play().catch(()=>{});
          }
        });
        
        if(btnSound) {
          btnSound.addEventListener('ended', () => {
             if(state.booted && !state.holding) audio.bg.play().catch(()=>{});
          });
        }

        // Mousedown
        a.addEventListener('mousedown', (e) => {
           if(e.button === 0) startMakita();
        });

        els.fileList.appendChild(a);
      });
    }

    /* =================================================
       6. MAKITA (HOLD & CRASH)
       ================================================= */
    
    document.addEventListener('mousemove', (e) => {
      els.cursor.style.display = 'block';
      els.cursor.style.left = e.clientX + 'px';
      els.cursor.style.top = e.clientY + 'px';
    });

    function startMakita() {
      if(!state.booted || state.crashed) return;
      state.holding = true;

      audio.bg.pause();
      if(state.currentHoverSound) state.currentHoverSound.pause();

      audio.makita.currentTime = 0;
      audio.makita.play().catch(()=>{});

      els.cursor.classList.add('cursor-spin');
      document.body.classList.add('chaos-mode');
    }

    function stopMakita() {
      if(!state.holding) return;
      state.holding = false;

      audio.makita.pause();
      els.cursor.classList.remove('cursor-spin');
      document.body.classList.remove('chaos-mode');
      els.danger.style.opacity = 0;

      if(!state.crashed) {
        state.heat = 0;
        updateHeat();
        audio.bg.play().catch(()=>{});
      }
    }

    setInterval(() => {
      if(state.crashed) return;

      if(state.holding) {
        state.heat += 2; 
        els.sysContainer.style.transform = `translate(${Math.random()*4 - 2}px, ${Math.random()*4 - 2}px)`; 
        els.danger.style.opacity = state.heat / 100;

        if(state.heat > 70) els.status.innerText = "WARNING: OVERHEAT";
        if(state.heat >= 100) crashSystem();
      } else {
        if(state.heat > 0) state.heat -= 5;
        els.sysContainer.style.transform = "none";
      }
      updateHeat();
    }, 50);

    function updateHeat() {
      if(state.heat < 0) state.heat = 0;
      els.heatBar.style.width = state.heat + "%";
      if(state.heat < 50) {
        els.heatBar.style.background = "var(--primary)";
        els.status.innerText = "ONLINE";
        els.status.style.color = "var(--primary)";
      } else {
        els.heatBar.style.background = "red";
        els.status.style.color = "red";
      }
    }

    function crashSystem() {
      state.crashed = true;
      state.holding = false;
      audio.makita.pause();
      audio.crash.play().catch(()=>{});

      document.body.style.background = "#0000aa"; 
      els.sysContainer.style.display = 'none';
      els.cursor.style.display = 'none';
      document.body.classList.remove('chaos-mode');
      
      els.bootScreen.style.display = 'flex';
      els.startBtn.style.display = 'none';
      els.bootText.innerHTML = "FATAL ERROR 0xC0000221<br>MAKITA RPM OVERLOAD.<br><br>Rebooting System...";

      setTimeout(() => location.reload(), 4000);
    }

    window.addEventListener('mousedown', (e) => {
      if(state.booted && (e.button === 1 || e.button === 0)) {
        if(e.button === 1) e.preventDefault(); 
        startMakita();
      }
    });
    window.addEventListener('mouseup', stopMakita);

  </script>
</body>
</html>
