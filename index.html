<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>THEWEE.SPACE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <!-- Fontes e Meta Tags -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #38bdf8;
      --glass: rgba(0, 0, 0, 0.6);
      --text: #f9fafb;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      cursor: none !important; /* ESCONDE O MOUSE PADRÃO PARA USAR A MAKITA */
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000; /* Cor de fundo caso a imagem falhe */
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
      background: url("./assets/Thiscloudfire.gif") center center / cover no-repeat fixed;
      display: flex;
      justify-content: center;
    }

    /* --- CURSOR PERSONALIZADO (MAKITA) --- */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 60px; /* Tamanho da makita */
      height: 60px;
      pointer-events: none; /* Permite clicar através da imagem */
      z-index: 99999;
      background-image: url("./assets/makita.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transform: translate(-50%, -50%); /* Centraliza no ponto do mouse */
      transition: transform 0.1s linear; /* Suavidade leve */
    }

    /* Animação de girar quando ativa */
    .spinning {
      animation: spin 0.1s linear infinite;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* --- OVERLAY DE START --- */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
    }
    #start-overlay p { animation: pulse 1s infinite; }

    /* --- CONTEÚDO NO RODAPÉ --- */
    main {
      position: absolute;
      bottom: 50px; /* Fica embaixo */
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-shadow: 0 0 15px var(--primary);
      pointer-events: auto; /* Permite interação */
    }

    .link-github {
      display: inline-flex;
      align-items: center;
      padding: 10px 25px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text);
      text-decoration: none;
      background: var(--glass);
      backdrop-filter: blur(10px);
      transition: 0.3s;
      pointer-events: auto; /* Permite clique */
    }

    .link-github:hover {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.2);
      transform: scale(1.05);
    }

    /* --- EFEITO DE TREMOR NA TELA --- */
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      25% { transform: translate(-2px, -2px) rotate(-1deg); }
      50% { transform: translate(2px, 1px) rotate(1deg); }
      75% { transform: translate(-1px, 2px) rotate(0deg); }
      100% { transform: translate(1px, -1px) rotate(-1deg); }
    }
    
    .shaking {
      animation: shake 0.05s infinite; /* Tremor muito rápido */
    }
    
    /* Botão Mute */
    #mute-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: 1px solid white;
      color: white;
      padding: 5px 10px;
      cursor: none; /* Esconde mouse também aqui */
      z-index: 100;
      pointer-events: auto;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

  <!-- Cursor Makita -->
  <div id="custom-cursor"></div>

  <!-- Tela Inicial -->
  <div id="start-overlay">
    <h1>[ CLIQUE PARA ENTRAR ]</h1>
  </div>

  <button id="mute-btn">SOM: ON</button>

  <div class="frame">
    <main>
      <h1>THEWEE</h1>
      <a id="github-link" class="link-github" href="https://github.com/theweewee" target="_blank">
        github.com/theweewee
      </a>
    </main>
  </div>

  <!-- Áudios -->
  <audio id="bg-audio" loop>
    <source src="https://www.myinstants.com/media/sounds/dexter-song-2.mp3" type="audio/mpeg" />
  </audio>
  <audio id="click-audio">
    <source src="https://www.myinstants.com/media/sounds/mamboman-bo-shi-ge-ju-matikanetannhauser.mp3" type="audio/mpeg" />
  </audio>
  <audio id="hover-audio">
    <source src="https://www.myinstants.com/media/sounds/foi-quando-gyro-finalmente-entendeu.mp3" type="audio/mpeg" />
  </audio>
  <audio id="hold-audio" loop>
    <source src="https://www.myinstants.com/media/sounds/makitaa.mp3" type="audio/mpeg" />
  </audio>

  <script>
    // Elementos Principais
    const cursor = document.getElementById('custom-cursor');
    const body = document.body;
    const overlay = document.getElementById('start-overlay');
    const githubLink = document.getElementById('github-link');
    const muteBtn = document.getElementById('mute-btn');

    // Áudios
    const audios = {
      bg: document.getElementById('bg-audio'),
      click: document.getElementById('click-audio'),
      hover: document.getElementById('hover-audio'),
      hold: document.getElementById('hold-audio')
    };

    let started = false;
    let isMuted = false;
    let isHolding = false;

    // 1. FAZER A MAKITA SEGUIR O MOUSE
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    // 2. INICIAR SITE
    overlay.addEventListener('click', () => {
      started = true;
      overlay.style.display = 'none';
      audios.bg.volume = 0.3;
      playSafe(audios.bg);
      playSafe(audios.click);
    });

    // 3. MUTE
    muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      muteBtn.innerText = isMuted ? "SOM: OFF" : "SOM: ON";
      Object.values(audios).forEach(a => a.muted = isMuted);
    });

    // 4. LÓGICA DA MAKITA (O CAOS)
    function startMakita() {
      if (!started) return;
      isHolding = true;
      
      // Para outros sons
      audios.bg.pause();
      audios.hover.pause();
      audios.hover.currentTime = 0;

      // Toca makita e anima
      playSafe(audios.hold);
      body.classList.add('shaking'); // Treme a tela
      cursor.classList.add('spinning'); // Gira a makita
    }

    function stopMakita() {
      if (!isHolding) return;
      isHolding = false;

      audios.hold.pause();
      audios.hold.currentTime = 0;
      
      body.classList.remove('shaking');
      cursor.classList.remove('spinning');

      if (started) playSafe(audios.bg);
    }

    // EVENTOS DE CLIQUE (MOUSE DOWN)
    window.addEventListener('mousedown', (e) => {
      // Botão Esquerdo (0) APENAS no link OU Botão do Meio (1) em QUALQUER LUGAR
      const isLeftClickOnLink = (e.button === 0 && (e.target === githubLink || githubLink.contains(e.target)));
      const isMiddleClick = (e.button === 1); // Botão da rodinha

      if (isLeftClickOnLink || isMiddleClick) {
        e.preventDefault(); // Evita scroll automático do botão do meio
        startMakita();
      }
    });

    // SOLTAR O CLIQUE (MOUSE UP)
    window.addEventListener('mouseup', () => {
      stopMakita();
    });

    // HOVER NO LINK (Somente se não estiver usando a makita)
    githubLink.addEventListener('mouseenter', () => {
      if (started && !isHolding) {
        audios.bg.pause();
        playSafe(audios.hover);
      }
    });

    githubLink.addEventListener('mouseleave', () => {
      if (started && !isHolding) {
         // Opcional: parar o som do hover ou deixar terminar
         if(audios.hover.paused) playSafe(audios.bg);
      }
    });
    
    audios.hover.addEventListener('ended', () => {
       if(started && !isHolding) playSafe(audios.bg);
    });

    // Função auxiliar para tocar sem erro
    function playSafe(audio) {
      if (!isMuted) audio.play().catch(e => console.log("Audio error:", e));
    }

  </script>
</body>
</html>
